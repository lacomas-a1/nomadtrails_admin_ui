<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Experience · Watamu, Kenya</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

</head>
<body class="bg-gray-50 dark:bg-gray-950 font-sans antialiased">
  <div class="mx-auto max-w-(--breakpoint-2xl) p-4 pb-20 md:p-6 md:pb-6">
    <!-- Breadcrumb Start -->
    <div x-data="{ pageName: `Add Experience` }">
      <div class="flex flex-wrap items-center justify-between gap-3 pb-6">
        <h2 class="text-xl font-semibold text-gray-800 dark:text-white/90" x-text="pageName"></h2>
        <nav>
          <ol class="flex items-center gap-1.5">
            <li>
              <a class="inline-flex items-center gap-1.5 text-sm text-gray-500 dark:text-gray-400" href="index.html">
                Home
                <svg class="stroke-current rtl:rotate-180" width="17" height="16" viewBox="0 0 17 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M6.0765 12.667L10.2432 8.50033L6.0765 4.33366" stroke="" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
              </a>
            </li>
            <li class="text-sm text-gray-800 dark:text-white/90" x-text="pageName"></li>
          </ol>
        </nav>
      </div>
    </div>
    <!-- Breadcrumb End -->

    <!-- Content Start -->
    <form action="/experiences" method="POST" enctype="multipart/form-data">
      <div class="space-y-6">

        <!-- Experience Description Card -->
        <div class="rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/3">
          <div class="border-b border-gray-200 px-6 py-4 dark:border-gray-800">
            <h2 class="text-lg font-medium text-gray-800 dark:text-white">
              Experience Description
            </h2>
          </div>
          <div class="p-4 sm:p-6 dark:border-gray-800">
            <div class="grid grid-cols-1 gap-5 md:grid-cols-2">
              <!-- Experience Name -->
              <div class="col-span-full">
                <label for="experience-name" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">Experience Name</label>
                <input type="text" id="experience-name" name="name" value="Watamu Coastal Escape" class="dark:bg-dark-900 shadow-theme-xs focus:border-brand-300 focus:ring-brand-500/10 dark:focus:border-brand-800 h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 placeholder:text-gray-400 focus:ring-3 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30" placeholder="Enter experience name">
              </div>

              <!-- Location / Region -->
              <div>
                <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">
                  Location
                </label>
                <div x-data="{ isOptionSelected: true }" class="relative z-20 bg-transparent">
                  <select name="location" class="dark:bg-dark-900 shadow-theme-xs focus:border-brand-300 focus:ring-brand-500/10 dark:focus:border-brand-800 h-11 w-full appearance-none rounded-lg border border-gray-300 bg-transparent bg-none px-4 py-2.5 pr-11 text-sm text-gray-800 placeholder:text-gray-400 focus:ring-3 focus:outline-hidden rtl:pr-4 rtl:pl-11 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30" :class="isOptionSelected &amp;&amp; 'text-gray-800 dark:text-white/90'" @change="isOptionSelected = true">
                    <option value="" class="text-gray-700 dark:bg-gray-900 dark:text-gray-400">Select Location</option>
                    <option value="Watamu, Kenya" selected class="text-gray-700 dark:bg-gray-900 dark:text-gray-400">Watamu, Kenya</option>
                    <option value="Diani, Kenya" class="text-gray-700 dark:bg-gray-900 dark:text-gray-400">Diani, Kenya</option>
                    <option value="Malindi, Kenya" class="text-gray-700 dark:bg-gray-900 dark:text-gray-400">Malindi, Kenya</option>
                    <option value="Lamu, Kenya" class="text-gray-700 dark:bg-gray-900 dark:text-gray-400">Lamu, Kenya</option>
                  </select>
                  <span class="pointer-events-none absolute top-1/2 right-4 z-30 -translate-y-1/2 text-gray-700 rtl:right-auto rtl:left-4 dark:text-gray-400">
                    <svg class="stroke-current" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path d="M4.79175 7.396L10.0001 12.6043L15.2084 7.396" stroke="" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                  </span>
                </div>
              </div>

              <!-- Available Season -->
              <div>
                <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">
                  Available Season
                </label>
                <div x-data="{ isOptionSelected: true }" class="relative z-20 bg-transparent">
                  <select name="season" class="dark:bg-dark-900 shadow-theme-xs focus:border-brand-300 focus:ring-brand-500/10 dark:focus:border-brand-800 h-11 w-full appearance-none rounded-lg border border-gray-300 bg-transparent bg-none px-4 py-2.5 pr-11 text-sm text-gray-800 placeholder:text-gray-400 focus:ring-3 focus:outline-hidden rtl:pr-4 rtl:pl-11 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30" :class="isOptionSelected &amp;&amp; 'text-gray-800 dark:text-white/90'" @change="isOptionSelected = true">
                    <option value="" class="text-gray-700 dark:bg-gray-900 dark:text-gray-400">Select Season</option>
                    <option value="September · October · November 2026" selected class="text-gray-700 dark:bg-gray-900 dark:text-gray-400">September · October · November 2026</option>
                    <option value="December · January · February 2027" class="text-gray-700 dark:bg-gray-900 dark:text-gray-400">December · January · February 2027</option>
                    <option value="March · April · May 2027" class="text-gray-700 dark:bg-gray-900 dark:text-gray-400">March · April · May 2027</option>
                  </select>
                  <span class="pointer-events-none absolute top-1/2 right-4 z-30 -translate-y-1/2 text-gray-700 rtl:right-auto rtl:left-4 dark:text-gray-400">
                    <svg class="stroke-current" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path d="M4.79175 7.396L10.0001 12.6043L15.2084 7.396" stroke="" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                  </span>
                </div>
              </div>

              <!-- Weekly Departures -->
              <div class="col-span-full">
                <label for="departures" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">Available Weekly Departures</label>
                <input type="text" id="departures" name="departures" value="Available Weekly Departures" class="dark:bg-dark-900 shadow-theme-xs focus:border-brand-300 focus:ring-brand-500/10 dark:focus:border-brand-800 h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 placeholder:text-gray-400 focus:ring-3 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30" placeholder="e.g. Available Weekly Departures">
              </div>

              <!-- Experience Tags / Highlights -->
              <div class="col-span-full">
                <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">Experience</label>
                <div class="flex flex-wrap items-center gap-2">
                  <label class="inline-flex items-center gap-2 rounded-full bg-blue-50 px-3 py-1.5 text-xs font-medium text-blue-700 ring-1 ring-blue-200 dark:bg-blue-900/30 dark:text-blue-300 dark:ring-blue-800 cursor-pointer">
                    <input type="checkbox" name="tags[]" value="Beach" checked class="h-3.5 w-3.5 rounded border-gray-300 text-brand-500 focus:ring-brand-500/10 dark:border-gray-600 dark:bg-gray-800">
                    Beach
                  </label>
                  <label class="inline-flex items-center gap-2 rounded-full bg-cyan-50 px-3 py-1.5 text-xs font-medium text-cyan-700 ring-1 ring-cyan-200 dark:bg-cyan-900/30 dark:text-cyan-300 dark:ring-cyan-800 cursor-pointer">
                    <input type="checkbox" name="tags[]" value="Marine" checked class="h-3.5 w-3.5 rounded border-gray-300 text-brand-500 focus:ring-brand-500/10 dark:border-gray-600 dark:bg-gray-800">
                    Marine
                  </label>
                  <label class="inline-flex items-center gap-2 rounded-full bg-emerald-50 px-3 py-1.5 text-xs font-medium text-emerald-700 ring-1 ring-emerald-200 dark:bg-emerald-900/30 dark:text-emerald-300 dark:ring-emerald-800 cursor-pointer">
                    <input type="checkbox" name="tags[]" value="Relaxation" checked class="h-3.5 w-3.5 rounded border-gray-300 text-brand-500 focus:ring-brand-500/10 dark:border-gray-600 dark:bg-gray-800">
                    Relaxation
                  </label>
                  <label class="inline-flex items-center gap-2 rounded-full bg-amber-50 px-3 py-1.5 text-xs font-medium text-amber-700 ring-1 ring-amber-200 dark:bg-amber-900/30 dark:text-amber-300 dark:ring-amber-800 cursor-pointer">
                    <input type="checkbox" name="tags[]" value="Adventure" class="h-3.5 w-3.5 rounded border-gray-300 text-brand-500 focus:ring-brand-500/10 dark:border-gray-600 dark:bg-gray-800">
                    Adventure
                  </label>
                  <label class="inline-flex items-center gap-2 rounded-full bg-purple-50 px-3 py-1.5 text-xs font-medium text-purple-700 ring-1 ring-purple-200 dark:bg-purple-900/30 dark:text-purple-300 dark:ring-purple-800 cursor-pointer">
                    <input type="checkbox" name="tags[]" value="Cultural" class="h-3.5 w-3.5 rounded border-gray-300 text-brand-500 focus:ring-brand-500/10 dark:border-gray-600 dark:bg-gray-800">
                    Cultural
                  </label>
                </div>
              </div>

              <!-- Description -->
              <div class="col-span-full">
                <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">
                  Description
                </label>
                <textarea name="description" rows="7" class="dark:bg-dark-900 shadow-theme-xs focus:border-brand-300 focus:ring-brand-500/10 dark:focus:border-brand-800 w-full resize-none rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 placeholder:text-gray-400 focus:ring-3 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30" placeholder="Describe the experience...">Discover the beauty of Watamu with pristine beaches, turquoise waters, marine adventures and unforgettable coastal experiences.</textarea>
              </div>
            </div>
          </div>
        </div>

        <!-- Pricing & Availability Card -->
        <div class="rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/3">
          <div class="border-b border-gray-200 px-6 py-4 dark:border-gray-800">
            <h2 class="text-lg font-medium text-gray-800 dark:text-white">
              Pricing &amp; Availability
            </h2>
          </div>
          <div class="space-y-5 p-4 sm:p-6">
            <div class="grid grid-cols-1 gap-5 sm:grid-cols-3">
              <div>
                <label for="price" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">Price (USD)</label>
                <input type="number" id="price" name="price" class="dark:bg-dark-900 shadow-theme-xs focus:border-brand-300 focus:ring-brand-500/10 dark:focus:border-brand-800 h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 placeholder:text-gray-400 focus:ring-3 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30" placeholder="0.00">
              </div>
              <div>
                <label for="deposit" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">Deposit (USD)</label>
                <input type="number" id="deposit" name="deposit" class="dark:bg-dark-900 shadow-theme-xs focus:border-brand-300 focus:ring-brand-500/10 dark:focus:border-brand-800 h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 placeholder:text-gray-400 focus:ring-3 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30" placeholder="0.00">
              </div>
              <div>
                <label for="max-guests" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">Max Guests</label>
                <input type="number" id="max-guests" name="max_guests" class="dark:bg-dark-900 shadow-theme-xs focus:border-brand-300 focus:ring-brand-500/10 dark:focus:border-brand-800 h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 placeholder:text-gray-400 focus:ring-3 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30" placeholder="12">
              </div>
            </div>
            <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">
              <div>
                <label class="mb-1 inline-block text-sm font-semibold text-gray-700 dark:text-gray-400">Stock Quantity</label>
                <div class="flex h-11 divide-x divide-gray-300 overflow-hidden rounded-lg border border-gray-300 dark:divide-gray-800 dark:border-gray-700">
                  <button type="button" class="inline-flex h-11 w-11 items-center justify-center bg-white text-gray-700 hover:bg-gray-100 dark:bg-gray-900 dark:text-gray-400 dark:hover:bg-gray-800 dark:hover:text-white">
                    <svg xmlns="http://www.w3.org/2000/svg" width="25" height="24" viewBox="0 0 25 24" fill="none">
                      <path d="M6.66699 12H18.6677" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                  </button>
                  <div class="flex-1">
                    <input type="text" name="stock_quantity" value="1" class="h-full w-full border-0 bg-white text-center text-sm text-gray-700 outline-none focus:ring-0 dark:bg-gray-900 dark:text-gray-400">
                  </div>
                  <button type="button" class="inline-flex h-11 w-11 items-center justify-center bg-white text-gray-700 hover:bg-gray-100 dark:bg-gray-900 dark:text-gray-400 dark:hover:bg-gray-800 dark:hover:text-white">
                    <svg xmlns="http://www.w3.org/2000/svg" width="25" height="24" viewBox="0 0 25 24" fill="none">
                      <path d="M6.66699 12.0002H18.6677M12.6672 6V18.0007" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                  </button>
                </div>
              </div>
              <div>
                <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">
                  Availability Status
                </label>
                <div x-data="{ isOptionSelected: false }" class="relative z-20 bg-transparent">
                  <select name="availability_status" class="dark:bg-dark-900 shadow-theme-xs focus:border-brand-300 focus:ring-brand-500/10 dark:focus:border-brand-800 h-11 w-full appearance-none rounded-lg border border-gray-300 bg-transparent bg-none px-4 py-2.5 pr-11 text-sm text-gray-800 placeholder:text-gray-400 focus:ring-3 focus:outline-hidden rtl:pr-4 rtl:pl-11 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30" :class="isOptionSelected &amp;&amp; 'text-gray-800 dark:text-white/90'" @change="isOptionSelected = true">
                    <option value="" class="text-gray-700 dark:bg-gray-900 dark:text-gray-400">
                      Select Availability
                    </option>
                    <option value="In Stock" class="text-gray-700 dark:bg-gray-900 dark:text-gray-400">
                      In Stock
                    </option>
                    <option value="Out of Stock" class="text-gray-700 dark:bg-gray-900 dark:text-gray-400">
                      Out of Stock
                    </option>
                  </select>
                  <span class="pointer-events-none absolute top-1/2 right-4 z-30 -translate-y-1/2 text-gray-700 rtl:right-auto rtl:left-4 dark:text-gray-400">
                    <svg class="stroke-current" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path d="M4.79175 7.396L10.0001 12.6043L15.2084 7.396" stroke="" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                  </span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Experience Files Card -->
        <div class="rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/3">
          <div class="border-b border-gray-200 px-6 py-4 dark:border-gray-800">
            <h2 class="text-lg font-medium text-gray-800 dark:text-white">
              Experience Files
            </h2>
          </div>
          <div class="p-4 sm:p-6">
            <!-- Images Upload -->
            <div class="mb-6">
              <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">Experience Images</label>
              <label for="experience-images" class="shadow-theme-xs group hover:border-brand-500 block cursor-pointer rounded-lg border-2 border-dashed border-gray-300 transition dark:border-gray-800">
                <div class="flex justify-center p-10">
                  <div class="flex max-w-[260px] flex-col items-center gap-4">
                    <div class="inline-flex h-13 w-13 items-center justify-center rounded-full border border-gray-200 text-gray-700 transition dark:border-gray-800 dark:text-gray-400">
                      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <path d="M20.0004 16V18.5C20.0004 19.3284 19.3288 20 18.5004 20H5.49951C4.67108 20 3.99951 19.3284 3.99951 18.5V16M12.0015 4L12.0015 16M7.37454 8.6246L11.9994 4.00269L16.6245 8.6246" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                      </svg>
                    </div>
                    <p class="text-center text-sm text-gray-500 dark:text-gray-400">
                      <span class="font-medium text-gray-800 dark:text-white/90">Click to upload images</span>
                      or drag and drop SVG, PNG, JPG or GIF (MAX. 800x400px)
                    </p>
                  </div>
                </div>
                <input type="file" id="experience-images" name="images[]" accept="image/*" multiple class="hidden">
              </label>
            </div>

            <!-- Documents Upload -->
            <div>
              <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">Experience Documents (PDF, DOC, etc.)</label>
              <label for="experience-documents" class="shadow-theme-xs group hover:border-brand-500 block cursor-pointer rounded-lg border-2 border-dashed border-gray-300 transition dark:border-gray-800">
                <div class="flex justify-center p-8">
                  <div class="flex max-w-[260px] flex-col items-center gap-3">
                    <div class="inline-flex h-12 w-12 items-center justify-center rounded-full border border-gray-200 text-gray-700 transition dark:border-gray-800 dark:text-gray-400">
                      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none">
                        <path d="M14 2H6C5.46957 2 4.96086 2.21071 4.58579 2.58579C4.21071 2.96086 4 3.46957 4 4V20C4 20.5304 4.21071 21.0391 4.58579 21.4142C4.96086 21.7893 5.46957 22 6 22H18C18.5304 22 19.0391 21.7893 19.4142 21.4142C19.7893 21.0391 20 20.5304 20 20V8L14 2Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M14 2V8H20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M12 18V12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M9 15L12 18L15 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                      </svg>
                    </div>
                    <p class="text-center text-sm text-gray-500 dark:text-gray-400">
                      <span class="font-medium text-gray-800 dark:text-white/90">Click to upload documents</span>
                      PDF, DOC, DOCX, TXT (MAX. 10MB)
                    </p>
                  </div>
                </div>
                <input type="file" id="experience-documents" name="documents[]" accept=".pdf,.doc,.docx,.txt" multiple class="hidden">
              </label>
            </div>
          </div>
        </div>

        <!-- Button -->
        <div class="flex flex-col gap-3 sm:flex-row sm:justify-end">
          <button type="button" class="shadow-theme-xs inline-flex items-center justify-center gap-2 rounded-lg bg-white px-4 py-3 text-sm font-medium text-gray-700 ring-1 ring-gray-300 transition hover:bg-gray-50 dark:bg-gray-800 dark:text-gray-400 dark:ring-gray-700 dark:hover:bg-white/3">
            Draft
          </button>
          <button type="submit" class="bg-brand-500 shadow-theme-xs hover:bg-brand-600 inline-flex items-center justify-center gap-2 rounded-lg px-4 py-3 text-sm font-medium text-white transition">
            Publish Experience
          </button>
        </div>
      </div>
    </form>
    <!-- Content End -->
  </div>
</body>
</html>
